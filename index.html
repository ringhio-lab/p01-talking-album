<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ずかん">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ずかん</title>
<style>
  :root { --gap: 10px; --bg: #1b1b1f; --fg: #f4f4f5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    /* 2歳児が誤操作しないよう選択・長押しメニューを止める */
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; }

  /* ヘッダーは長押しで親モードに入る隠し入口。見えるボタンは子供が押すので置かない */
  header { height: env(safe-area-inset-top, 0px); }

  #grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap);
    padding: var(--gap); padding-top: calc(var(--gap) + env(safe-area-inset-top, 0px));
    padding-bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px)); }
  .card { position: relative; aspect-ratio: 1; border-radius: 18px; overflow: hidden;
    background: #2a2a30; border: none; padding: 0; cursor: pointer; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .card:active { transform: scale(.96); transition: transform .08s; }
  .card.playing { outline: 4px solid #ffd166; outline-offset: -4px; }

  /* タップした写真を大きく出す。2歳児向けなので閉じるボタンは無く、どこでも触れば閉じる */
  #big { position: fixed; inset: 0; background: #000; display: none;
    align-items: center; justify-content: center; z-index: 10; }
  #big.on { display: flex; }
  #big img { max-width: 100%; max-height: 100%; object-fit: contain; }

  #empty { padding: 24px; text-align: center; opacity: .75; line-height: 1.8; font-size: 15px; }

  /* 親モード */
  #parent { position: fixed; inset: 0; background: #101014; z-index: 20; display: none;
    flex-direction: column; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px
      calc(16px + env(safe-area-inset-bottom, 0px)); overflow: auto; }
  #parent.on { display: flex; }
  #parent h1 { font-size: 17px; margin: 0 0 12px; font-weight: 600; }
  #parent .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  button, label.btn { font: inherit; font-size: 15px; padding: 11px 15px; border-radius: 11px;
    border: 1px solid #3a3a44; background: #26262e; color: var(--fg); cursor: pointer; }
  button.primary { background: #3d7dff; border-color: #3d7dff; }
  button.rec { background: #e5484d; border-color: #e5484d; }
  button:disabled { opacity: .4; }
  #list { margin-top: 8px; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid #26262e; }
  .item img { width: 54px; height: 54px; object-fit: cover; border-radius: 9px; }
  .item .meta { flex: 1; min-width: 0; font-size: 13px; opacity: .8; }
  .hint { font-size: 12px; opacity: .55; line-height: 1.7; }
</style>
</head>
<body>
<header id="hdr"></header>

<div id="grid"></div>
<div id="empty" hidden>
  写真がまだありません。<br>
  <b>画面上部を1秒長押し</b>すると<br>おとうさん用の画面がひらきます。
</div>

<div id="big"><img id="bigImg" alt=""></div>

<div id="parent">
  <h1>おとうさん用</h1>
  <div class="row">
    <label class="btn">写真をえらぶ
      <input id="pick" type="file" accept="image/*" multiple hidden>
    </label>
    <button id="close">とじる</button>
  </div>
  <p class="hint">
    写真をえらぶと下に並びます。1枚ずつ「ろくおん」を押して名前を吹き込んでください。<br>
    写真と声は<b>この端末の中だけ</b>に保存され、どこにも送信されません。
  </p>
  <div id="list"></div>
</div>

<script src="app.js"></script>
</body>
</html>
